# dsh-figma bundle patch: inserts this plugin into a profile's layer stack.
#
# Installing the package through the official CLI —
#
#   dsh plugin --profile web add dsh-figma
#
# — appends `dsh-figma` to `dsh.profile.bundles`, and the profile boot merges
# this patch (a single `insert` of the plugin row) like any other layer. The
# profile's own cordis.patch.yml is applied *after* every bundle layer, so it
# is the right place to override config by targeting `id: figma`:
#
#   - id: figma
#     config:
#       outputDir: .figma
#
# Every config key is optional, and none is needed for sign-in to work: the
# plugin carries its own Figma OAuth app and writes rendered exports to
# `<cwd>/.dsh-figma`. A user connects from Settings → Figma by pressing one
# button; nothing has to be configured here.
#
# Keys worth setting in a deployment:
#
#   redirectUri: ...          # only behind a reverse proxy; the default is the
#                             # live GUI callback, and the route lives on that
#                             # same server.
#   connectionRoutes: true    # false = tools only, no HTTP surface, no sign-in
#   outputDir: .figma         # where screenshots and exports land
#
# To use a different OAuth app than the one shipped in lib/oauth-app.js —
# typically to rotate the secret — set clientId here and the secret through the
# environment, so no secret enters the composition file:
#
#   - id: figma
#     config:
#       clientId: !!js process.env.FIGMA_CLIENT_ID
#       clientSecret: !!js process.env.FIGMA_CLIENT_SECRET
#
# A deployment with no web server simply registers the tools and no routes;
# `figma_login` then reports that sign-in is unavailable.
- insert:
    - id: figma
      name: 'dsh-figma'
