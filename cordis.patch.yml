# dsh-figma bundle patch: inserts this plugin into a profile's layer stack.
#
# Installing the package through the official CLI —
#
#   dsh plugin --profile web add dsh-figma
#
# — appends `dsh-figma` to `dsh.profile.bundles`, and the profile boot merges
# this patch (a single `insert` of the plugin row) like any other layer. The
# profile's own cordis.patch.yml is applied *after* every bundle layer, so it
# is the right place to override config by targeting `id: figma`:
#
#   - id: figma
#     config:
#       accessToken: !!js process.env.FIGMA_ACCESS_TOKEN
#       outputDir: .figma
#
# Every config key is optional: with no config at all the plugin offers OAuth
# sign-in from Settings → Figma, falls back to `FIGMA_ACCESS_TOKEN` /
# `FIGMA_TOKEN` (environment or the harness credential store) for headless use,
# and writes rendered exports to `<cwd>/.dsh-figma`.
#
# The OAuth client is configured per user at runtime by the connection panel,
# so nothing has to be set here for the browser sign-in to work. To pre-seed it
# instead — useful for a shared deployment — give the row a client id and let
# the secret live in the credential store:
#
#   - id: figma
#     config:
#       clientId: !!js process.env.FIGMA_CLIENT_ID
#       clientSecretRef: FIGMA_CLIENT_SECRET
#       callbackPort: 3080          # 0 (default) follows the live GUI port
#       connectionRoutes: true      # false = tools only, no HTTP surface
#
# A deployment with no web server simply registers the tools and no routes.
- insert:
    - id: figma
      name: 'dsh-figma'
